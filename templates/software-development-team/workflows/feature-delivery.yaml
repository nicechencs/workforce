id: software-development-team.feature-delivery
version: "0.1.0"
status: published
protocolVersion: "0.1"
name: Feature delivery
description: >
  Confirm a Plan Artifact, run two isolated Developer Tasks, integrate patches by
  stable Node ID, then Review and human artifact approval on one digest.
entry: planning
stages:
  - id: planning
    worker: planner
    via: task_run
    runtimeCommand: run.start
    output: out_plan
    schemaRef: urn:workforce:plan-artifact:0.1
    gate: plan
    publishes: workflowVersion
    confirmAfter: schema_validated
    unboundedSplit: deny
  - id: implementation
    worker: developer
    parallel: true
    nodeIdPattern: dev_*
    onUpstream: outputs_ready
    completesWithout: reviewer
  - id: integration
    kind: delivery
    strategy: stable_node_id_order
    worktree: dedicated
    provision: workspace.provisionIntegrationWorkspace
    apply: workspace.applyPatch
    onConflict: human
    silentOverwrite: deny
    reintegrationInvalidatesApprovals: true
    bindDigest: [review, artifact_approval]
  - id: review
    worker: reviewer
    onUpstream: outputs_ready
    bindDigest: integration
  - id: acceptance
    kind: approval
    gate: artifact
    bindDigest: integration
  - id: export
    kind: delivery_bundle
    trace: [runId, artifactVersionId, contentDigest, evaluation]
    autoPush: false
    autoPullRequest: false
failurePolicy:
  type: fail_workflow
concurrencyPolicy:
  runWorktree: isolated
  integrationWorktree: dedicated
constraints:
  autoPush: false
  autoPullRequest: false
  developerCompletesWithoutReviewer: true
mockPlanFixture: fixtures/mock-plan.json
